version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ALLOWED_ORIGIN=${CLIENT_DOMAIN:-http://localhost:5173}
      - PULSETECH_PRODUCTION=1
      - PULSETECH_SECRET_KEY=${PULSETECH_SECRET_KEY:-CHANGE-THIS-IN-PRODUCTION}
      - PULSETECH_LICENSE_KEY=${PULSETECH_LICENSE_KEY:-}
      - PULSETECH_LICENSE_EXPIRY=${PULSETECH_LICENSE_EXPIRY:-2027-12-31}
      - PULSETECH_IP_WHITELIST=${PULSETECH_IP_WHITELIST:-}
      - PULSETECH_RATE_LIMIT=${PULSETECH_RATE_LIMIT:-100}
    volumes:
      - gnn_checkpoints:/app/gnn/checkpoints
      - audit_logs:/app/logs
    restart: unless-stopped
    networks:
      - pulsetech

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pulsetech

volumes:
  gnn_checkpoints:
  audit_logs:

networks:
  pulsetech:
    driver: bridge
